name: Lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Top-level: read-only by default (CKV2_GHA_1). Write scopes live at job level.
permissions:
  contents: read

jobs:
  lint:
    permissions:
      contents: read
      statuses: write
      pull-requests: write
    uses: LukeEvansTech/shared-workflows/.github/workflows/super-linter.yml@4f77b1856421438fefe16f69ed4dd682a445f7b1 # v1
    with:
      # Blocking from the first commit: the repo was lint-gated locally with sl-gate before it was pushed.
      soft-launch: false
